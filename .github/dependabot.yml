version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # pin @types/node on the Node LTS major (24) — v25 tracks Node Current
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Rien d'autre ici : les majeures doivent rester *proposées*, même quand
      # on ne compte pas les merger tout de suite. Une PR majeure en échec est
      # une information (ce qui casse, et où), et `ignore` la ferait disparaître
      # — y compris pour les mises à jour de sécurité de ces versions.
      # Le filet de sécurité reste `pnpm audit --prod --audit-level high` en CI.
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    # Groupé comme pour npm : une PR par semaine au lieu d'une par action.
    # Ces bumps ne touchent que .github/, donc `ignoreCommand` (vercel.json)
    # leur évite désormais de déclencher un déploiement — et donc une purge du
    # cache ISR. Le groupe sert la lisibilité, pas le CPU.
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
