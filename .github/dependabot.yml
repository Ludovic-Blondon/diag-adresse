version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # pin @types/node on the Node LTS major (24) — v25 tracks Node Current
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # maplibre-gl v6 casse deux choses dans components/risk-map.tsx :
      # l'export `default` disparaît, et le namespace global `GeoJSON` n'est
      # plus fourni (v5 tirait @types/geojson en dépendance). Aucun test ne
      # couvre le rendu de la carte, donc la migration demande une vérification
      # visuelle en local. Reporté volontairement — à rouvrir avec du temps
      # dédié, pas au fil d'une PR Dependabot.
      - dependency-name: "maplibre-gl"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    # Groupé comme pour npm : une PR par semaine au lieu d'une par action.
    # Ces bumps ne touchent que .github/, donc `ignoreCommand` (vercel.json)
    # leur évite désormais de déclencher un déploiement — et donc une purge du
    # cache ISR. Le groupe sert la lisibilité, pas le CPU.
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
